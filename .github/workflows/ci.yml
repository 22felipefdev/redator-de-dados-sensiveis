name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      - name: Testes, sintaxe, baseline e auditoria
        run: python ci/verificar.py
        # Para incluir o front, descomente e aponte para o checkout do React:
        # env:
        #   WEB_DIR: ${{ github.workspace }}/web

      - name: Construir imagem
        run: docker build -t redator-api:ci .

      - name: Escanear imagem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: redator-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
