name: CI

# Ações fixadas por SHA para evitar execução de código de tags mováveis.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Instalar Tesseract para os testes de OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências com hash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Testes, sintaxe, lock, baseline e auditoria
        run: python ci/verificar.py
        # Para incluir o front, descomente e aponte para o checkout do React:
        # env:
        #   WEB_DIR: ${{ github.workspace }}/web

      - name: Construir imagem
        run: docker build -t redator-api:ci .

      - name: Escanear imagem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redator-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # O pip publica um SBOM interno com versões vendidas (msgpack,
          # urllib3, setuptools) que não são as instaladas na aplicação.
          skip-files: /usr/local/lib/python3.13/site-packages/pip/_vendor/vendor.txt,/usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json
