name: CI

# Ações fixadas por SHA para evitar execução de código de tags mováveis.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Instalar dependências com hash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Testes, sintaxe, lock, baseline e auditoria
        run: python ci/verificar.py
        # Para incluir o front, descomente e aponte para o checkout do React:
        # env:
        #   WEB_DIR: ${{ github.workspace }}/web

      - name: Construir imagem
        run: docker build -t redator-api:ci .

      - name: Escanear imagem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@f9424c10c36e288d5fa79bd3dfd1aeb2d6eae808 # v0.33.0
        with:
          image-ref: redator-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
