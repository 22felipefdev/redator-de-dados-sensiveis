name: Release

# Publica imagens por tag, gera SBOM e assina com cosign (sem chave persistida).
# O front só é publicado se o repositório dele estiver em WEB_REPO ou no input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      web_repo:
        description: "Repositório do front no GitHub (opcional, owner/repo)"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGEM: ghcr.io/${{ github.repository }}/api
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login no GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Construir e enviar API
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.ref_name }}
            ${{ env.IMAGEM }}:latest

      - name: Gerar SBOM com Syft
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          image-ref: ${{ env.IMAGEM }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: false

      - name: Assinar, atestar e verificar
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          ALVO="${IMAGEM}@${DIGEST}"
          IDENTIDADE="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(tags|heads)/.+"
          cosign sign --yes "${ALVO}"
          cosign attest --yes --predicate sbom-api.spdx.json --type spdxjson "${ALVO}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTIDADE}" \
            "${ALVO}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTIDADE}" \
            "${ALVO}" > /dev/null
          printf 'IMAGEM_API=%s\n' "${ALVO}" > image-digests.env

      - name: Publicar evidências da API
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidencias-api
          path: |
            sbom-api.spdx.json
            image-digests.env

  web:
    if: vars.WEB_REPO != '' || (github.event_name == 'workflow_dispatch' && inputs.web_repo != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGEM: ghcr.io/${{ github.repository }}/web
    steps:
      - name: Checkout do front
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.web_repo || vars.WEB_REPO }}
          token: ${{ secrets.WEB_REPO_TOKEN || github.token }}
          path: web
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login no GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Construir e enviar front
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./web
          file: ./web/Dockerfile.prod
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.ref_name }}
            ${{ env.IMAGEM }}:latest

      - name: Gerar SBOM com Syft
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          image-ref: ${{ env.IMAGEM }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-web.spdx.json
          upload-artifact: false

      - name: Assinar, atestar e verificar
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          ALVO="${IMAGEM}@${DIGEST}"
          IDENTIDADE="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(tags|heads)/.+"
          cosign sign --yes "${ALVO}"
          cosign attest --yes --predicate sbom-web.spdx.json --type spdxjson "${ALVO}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTIDADE}" \
            "${ALVO}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTIDADE}" \
            "${ALVO}" > /dev/null
          printf 'IMAGEM_WEB=%s\n' "${ALVO}" > image-web.env

      - name: Publicar evidências do front
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidencias-web
          path: |
            sbom-web.spdx.json
            image-web.env
