name: Release

# Publica API e front por tag a partir deste monorepo, gera SBOM e assina com
# cosign keyless (sem chave persistida).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGEM: ghcr.io/${{ github.repository }}/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          # Versão fixada e retries para quedas transitórias do CDN do GitHub.
          cosign-release: v3.1.5
          curl-retries: "6"

      - name: Construir e enviar API
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.ref_name }}
            ${{ env.IMAGEM }}:latest

      - name: Gerar SBOM com Syft
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.IMAGEM }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: false

      - name: Assinar, atestar e verificar
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          ALVO="${IMAGEM}@${DIGEST}"
          IDENTIDADE="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(tags|heads)/.+"
          cosign sign --yes "${ALVO}"
          cosign attest --yes --predicate sbom-api.spdx.json --type spdxjson "${ALVO}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTIDADE}" \
            "${ALVO}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTIDADE}" \
            "${ALVO}" > /dev/null
          printf 'IMAGEM_API=%s\n' "${ALVO}" > image-digests.env

      - name: Publicar evidências da API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidencias-api
          path: |
            sbom-api.spdx.json
            image-digests.env

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGEM: ghcr.io/${{ github.repository }}/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          # Versão fixada e retries para quedas transitórias do CDN do GitHub.
          cosign-release: v3.1.5
          curl-retries: "6"

      - name: Construir e enviar front
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          file: ./web/Dockerfile.prod
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.ref_name }}
            ${{ env.IMAGEM }}:latest

      - name: Gerar SBOM com Syft
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.IMAGEM }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-web.spdx.json
          upload-artifact: false

      - name: Assinar, atestar e verificar
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          ALVO="${IMAGEM}@${DIGEST}"
          IDENTIDADE="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(tags|heads)/.+"
          cosign sign --yes "${ALVO}"
          cosign attest --yes --predicate sbom-web.spdx.json --type spdxjson "${ALVO}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTIDADE}" \
            "${ALVO}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${IDENTIDADE}" \
            "${ALVO}" > /dev/null
          printf 'IMAGEM_WEB=%s\n' "${ALVO}" > image-web.env

      - name: Publicar evidências do front
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidencias-web
          path: |
            sbom-web.spdx.json
            image-web.env

  publicar:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Baixar evidências
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" -n evidencias-api -D evidencias-api
          gh run download "$GITHUB_RUN_ID" -n evidencias-web -D evidencias-web

      - name: Criar ou atualizar o Release
        run: |
          set -eu
          {
            echo "Imagens publicadas no GHCR e assinadas com cosign keyless."
            echo
            echo '```'
            cat evidencias-api/image-digests.env
            cat evidencias-web/image-web.env
            echo '```'
            echo
            echo "Os SBOMs SPDX em anexo também foram atestados no registro."
          } > notas.md

          ASSETS="
            evidencias-api/sbom-api.spdx.json
            evidencias-api/image-digests.env
            evidencias-web/sbom-web.spdx.json
            evidencias-web/image-web.env
          "

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notas.md
            # shellcheck disable=SC2086
            gh release upload "$TAG" $ASSETS --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --title "$TAG" --notes-file notas.md $ASSETS
          fi
